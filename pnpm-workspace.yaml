  - '@nuxt/cli@4.0.0'
  - '@nuxt/vite-server@4.6.0'
  - '@nuxt/devtools-kit@4.0.0-beta.4'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
