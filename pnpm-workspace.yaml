  - postcss-normalize-timing-functions@9.0.5
  - postcss-normalize-display-values@9.0.5
  - postcss-normalize-repeat-style@9.0.5
  - postcss-normalize-whitespace@9.0.5
  - postcss-normalize-positions@9.0.6
  - postcss-minify-font-values@9.0.7
  - postcss-reduce-transforms@9.0.4
  - postcss-discard-overridden@9.0.5
  - postcss-normalize-unicode@9.0.5
  - postcss-discard-duplicates@9.0.5
  - postcss-unique-selectors@9.0.5
  - postcss-normalize-charset@9.0.5
  - postcss-normalize-string@9.0.5
  - postcss-minify-selectors@9.0.6
  - postcss-minify-gradients@9.0.6
  - postcss-discard-comments@9.0.6
  - postcss-reduce-initial@9.0.6
