  # Keep the Unhead packages aligned until an upstream patch is available.
  '@unhead/bundler': ^3.4.2
  '@unhead/vue': ^3.4.2
  cssnano: 9.2.2
  cssnano-preset-default: 9.2.2
  cssnano-utils: 8.1.0
  nuxt-schema-org: https://pkg.pr.new/harlan-zw/nuxt-schema-org/nuxt-schema-org@92d351e5b56e8bbcfb20951947a3354ffdf720c8
  nuxt-site-config: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config@b8c8a6978ce818d77ecc50c679d412e748fdbdcb
  nuxt-site-config-kit: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config-kit@b8c8a6978ce818d77ecc50c679d412e748fdbdcb
  nuxtseo-shared: https://pkg.pr.new/harlan-zw/nuxt-seo/nuxtseo-shared@226c091a0744b7286ef721ac035eed53856bfaa5
  postcss-colormin: 9.0.6
  postcss-convert-values: 9.0.7
  postcss-discard-comments: 9.0.6
  postcss-discard-duplicates: 9.0.5
  postcss-discard-empty: 9.0.5
  postcss-discard-overridden: 9.0.5
  postcss-merge-longhand: 9.2.0
  postcss-merge-rules: 9.0.8
  postcss-minify-font-values: 9.0.7
  postcss-minify-gradients: 9.0.6
  postcss-minify-params: 9.0.6
  postcss-minify-selectors: 9.0.6
  postcss-normalize-charset: 9.0.5
  postcss-normalize-display-values: 9.0.5
  postcss-normalize-positions: 9.0.6
  postcss-normalize-repeat-style: 9.0.5
  postcss-normalize-string: 9.0.5
  postcss-normalize-timing-functions: 9.0.5
  postcss-normalize-unicode: 9.0.5
  postcss-normalize-url: 9.0.5
  postcss-normalize-whitespace: 9.0.5
  postcss-ordered-values: 9.0.6
  postcss-reduce-initial: 9.0.6
  postcss-reduce-transforms: 9.0.4
  postcss-svgo: 9.0.4
  postcss-unique-selectors: 9.0.5
  site-config-stack: https://pkg.pr.new/harlan-zw/nuxt-site-config/site-config-stack@b8c8a6978ce818d77ecc50c679d412e748fdbdcb

  stylehacks: 9.0.7
  unhead: ^3.4.2
  vue: ^3.5.43

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': true
  better-sqlite3: false
  esbuild: true
  protobufjs: false
  simple-git-hooks: false
  unrs-resolver: false
  vue-demi: true
  workerd: false

ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

